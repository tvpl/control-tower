      "patch": {
        "summary": "Editar suppliers com versão e motivo",
        "parameters": [
          {
            "$ref": "#/components/parameters/Program"
          },
          {
            "$ref": "#/components/parameters/Id"
          },
          {
            "$ref": "#/components/parameters/Match"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "code": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 40,
                    "pattern": "^[A-Z0-9_-]+$"
                  },
                  "name": {
                    "type": "string",
                    "minLength": 2,
                    "maxLength": 500
                  },
                  "owner_id": {
                    "anyOf": [
                      {
                        "type": "string",
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "status": {
                    "default": "ACTIVE",
                    "type": "string",
                    "enum": [
                      "ACTIVE",
                      "INACTIVE"
                    ]
                  },
                  "contact_url": {
                    "anyOf": [
                      {
                        "type": "string",
                        "format": "uri"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "classification": {
                    "default": "INTERNAL",
                    "type": "string",
                    "enum": [
                      "PUBLIC",
                      "INTERNAL",
                      "CONFIDENTIAL"
                    ]
                  },
                  "changeReason": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 2000
                  }
                },
                "required": [
                  "changeReason"
