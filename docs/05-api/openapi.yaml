      "patch": {
        "summary": "Editar programs com versão e motivo",
        "parameters": [
          {
            "$ref": "#/components/parameters/Program"
          },
          {
            "$ref": "#/components/parameters/Id"
          },
          {
            "$ref": "#/components/parameters/Match"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "code": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 40,
                    "pattern": "^[A-Z0-9_-]+$"
                  },
                  "name": {
                    "type": "string",
                    "minLength": 2,
                    "maxLength": 500
                  },
                  "owner_id": {
                    "anyOf": [
                      {
                        "type": "string",
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inventory_estimate": {
                    "anyOf": [
                      {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 10000000
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inventory_estimate_as_of": {
                    "anyOf": [
                      {
                        "type": "string",
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inventory_estimate_notes": {
                    "anyOf": [
                      {
                        "type": "string",
                        "maxLength": 2000
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "description": {
                    "anyOf": [
                      {
                        "type": "string",
                        "maxLength": 2000
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "timezone": {
                    "default": "America/Sao_Paulo",
                    "type": "string"
                  },
                  "health_policy": {
                    "type": "object",
                    "properties": {
                      "stale_days": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 90
                      },
                      "delay_tolerance_days": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 30
                      },
                      "dependency_minimum": {
                        "type": "string",
                        "enum": [
                          "HIGH",
                          "CRITICAL"
                        ]
                      }
                    },
                    "required": [
                      "stale_days",
                      "delay_tolerance_days",
                      "dependency_minimum"
                    ],
                    "additionalProperties": false
                  },
                  "ai_enabled": {
                    "type": "boolean"
                  },
                  "changeReason": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 2000
                  }
                },
                "required": [
                  "changeReason"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operação concluída",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/programsResource"
                }
              }
            }
          },
          "400": {
            "description": "Problem Details",
