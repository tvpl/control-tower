      "patch": {
        "summary": "Editar connections com versão e motivo",
        "parameters": [
          {
            "$ref": "#/components/parameters/Program"
          },
          {
            "$ref": "#/components/parameters/Id"
          },
          {
            "$ref": "#/components/parameters/Match"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "minLength": 2,
                    "maxLength": 500
                  },
                  "connector_type": {
                    "type": "string",
                    "enum": [
                      "JIRA",
                      "AZURE_DEVOPS",
                      "GITHUB",
                      "GITLAB",
                      "CONFLUENCE",
                      "CATALOGUE"
                    ]
                  },
                  "base_url": {
                    "type": "string",
                    "format": "uri"
                  },
                  "secret_env": {
                    "type": "string",
                    "pattern": "^MCT_CONNECTOR_[A-Z0-9_]+$"
                  },
                  "project": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  },
                  "deployment": {
                    "default": "CLOUD",
                    "type": "string",
                    "enum": [
                      "CLOUD",
                      "SERVER"
                    ]
                  },
                  "jira_email": {
                    "anyOf": [
                      {
                        "type": "string",
                        "format": "email",
                        "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "gitlab_options": {
                    "default": {
                      "api": "ISSUES",
                      "scope": "PROJECT",
                      "labels": []
                    },
                    "type": "object",
                    "properties": {
                      "api": {
                        "default": "ISSUES",
                        "type": "string",
                        "enum": [
                          "ISSUES",
                          "WORK_ITEMS"
                        ]
                      },
                      "scope": {
                        "default": "PROJECT",
                        "type": "string",
                        "enum": [
                          "PROJECT",
                          "GROUP"
                        ]
                      },
                      "labels": {
                        "default": [],
                        "maxItems": 20,
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 100
                        }
                      }
                    },
                    "additionalProperties": false
                  },
                  "state_mapping": {
                    "default": {},
                    "type": "object",
                    "propertyNames": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100
                    },
                    "additionalProperties": {
                      "type": "string",
                      "enum": [
                        "NOT_STARTED",
                        "IN_PROGRESS",
                        "DONE",
                        "BLOCKED",
                        "ON_HOLD",
                        "CANCELLED",
                        "REOPENED",
                        "UNKNOWN"
                      ]
                    }
                  },
                  "field_mapping": {
                    "default": {
                      "execution_status": "operationalState"
                    },
                    "type": "object",
                    "properties": {
                      "execution_status": {
                        "type": "string",
                        "const": "operationalState"
                      },
                      "name": {
                        "type": "string",
                        "const": "title"
                      }
                    },
                    "additionalProperties": false
                  },
                  "execution_owner": {
                    "default": "CONTROL_TOWER",
                    "type": "string",
                    "enum": [
                      "CONTROL_TOWER",
                      "EXTERNAL"
                    ]
                  },
                  "webhook_secret_env": {
                    "anyOf": [
                      {
                        "type": "string",
                        "pattern": "^MCT_CONNECTOR_[A-Z0-9_]+$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "enabled": {
                    "default": false,
                    "type": "boolean"
                  },
                  "poll_interval_seconds": {
                    "default": 900,
                    "type": "integer",
                    "minimum": 60,
                    "maximum": 86400
                  },
                  "changeReason": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 2000
                  }
                },
                "required": [
                  "changeReason"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operação concluída",
